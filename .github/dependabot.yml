version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    rebase-strategy: auto
    ignore:
      - dependency-name: "uuid"
        versions: [">=10.0.0"]
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    rebase-strategy: auto
