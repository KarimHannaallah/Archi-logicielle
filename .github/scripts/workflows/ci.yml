name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      task-service: ${{ steps.changes.outputs.task-service }}
      project-service: ${{ steps.changes.outputs.project-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: changes
        run: bash .github/scripts/detect-changes.sh

  build-services:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: task-service
            changed: ${{ needs.detect-changes.outputs.task-service }}
          - service: project-service
            changed: ${{ needs.detect-changes.outputs.project-service }}
          - service: notification-service
            changed: ${{ needs.detect-changes.outputs.notification-service }}
    if: ${{ matrix.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci -w services/${{ matrix.service }}
      - name: Lint
        run: npm run lint -w services/${{ matrix.service }}
      - name: Architecture lint
        run: npm run lint:arch -w services/${{ matrix.service }}
        continue-on-error: true
      - run: npm test -w services/${{ matrix.service }} -- --coverage --coverageReporters=lcov --coverageReporters=json-summary
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage/

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci -w frontend
      - name: Lint
        run: npm run lint -w frontend
        continue-on-error: true
      - run: npm run build -w frontend

  docker-build:
    needs: [build-services, build-frontend]
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build task-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/task-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: task-service:${{ github.sha }}

      - name: Build project-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/project-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: project-service:${{ github.sha }}

      - name: Build notification-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notification-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: notification-service:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: frontend:${{ github.sha }}