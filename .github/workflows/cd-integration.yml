name: CD — Integration

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-integration
  cancel-in-progress: false

jobs:
  deploy-integration:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Deploy to integration VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_INT }}
          username: ${{ secrets.VM_USER_INT }}
          key: ${{ secrets.SSH_PRIVATE_KEY_INT }}
          script: |
            set -e
            cd /opt/app

            # Télécharger le fichier compose depuis GitHub
            curl -sf \
              "https://raw.githubusercontent.com/KarimHannaallah/Archi-logicielle/main/docker-compose.integration.yml" \
              -o docker-compose.integration.yml

            echo "✅ docker-compose.integration.yml téléchargé"

            # Sauvegarder les images actuelles pour rollback
            docker compose -f docker-compose.integration.yml ps -q \
              | xargs -r docker inspect --format='{{.Image}} {{.Name}}' \
              > /tmp/previous-images.txt || true
            echo "Previous images saved:"
            cat /tmp/previous-images.txt || true

            # Pull latest images from GHCR
            echo "Pulling latest images..."
            docker compose -f docker-compose.integration.yml pull

            # Start services
            docker compose -f docker-compose.integration.yml up -d

            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            RETRIES=30
            for i in $(seq 1 $RETRIES); do
              HEALTHY=$(docker compose -f docker-compose.integration.yml ps --format json | grep -c '"healthy"' || true)
              echo "  healthy: $HEALTHY/4 (attempt $i/$RETRIES)"
              [ "$HEALTHY" -ge 4 ] && break
              if [ "$i" -eq "$RETRIES" ]; then
                echo "ERROR: Services failed to become healthy"
                exit 1
              fi
              sleep 10
            done

            echo "All services healthy ✅"
            docker compose -f docker-compose.integration.yml ps

      - name: Post-deploy healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_INT }}
          username: ${{ secrets.VM_USER_INT }}
          key: ${{ secrets.SSH_PRIVATE_KEY_INT }}
          script: |
            set -e
            echo "Waiting 15s for services to stabilize..."
            sleep 15
            echo "Running healthchecks..."
            curl -sf http://localhost:3001/health || (echo "auth-service FAIL" && exit 1)
            curl -sf http://localhost:3000/health || (echo "task-service FAIL" && exit 1)
            curl -sf http://localhost:3002/health || (echo "project-service FAIL" && exit 1)
            curl -sf http://localhost:3003/health || (echo "notification-service FAIL" && exit 1)
            curl -sf -o /dev/null -w "%{http_code}" http://localhost/ | grep -q "200\|301\|302" || (echo "frontend FAIL" && exit 1)
            echo "All healthchecks passed ✅"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_INT }}
          username: ${{ secrets.VM_USER_INT }}
          key: ${{ secrets.SSH_PRIVATE_KEY_INT }}
          script: |
            cd /opt/app
            echo "Rolling back to previous images..."

            if [ -f /tmp/previous-images.txt ] && [ -s /tmp/previous-images.txt ]; then
              docker compose -f docker-compose.integration.yml down

              while IFS=' ' read -r image name; do
                SERVICE=$(echo "$name" | sed 's|.*-\([^-]*\)-1$|\1|' | tr -d '/')
                if docker image inspect "$image" > /dev/null 2>&1; then
                  echo "Retagging $image for $SERVICE"
                  docker tag "$image" "ghcr.io/karimhannaallah/archi-logicielle/$SERVICE:latest" || true
                fi
              done < /tmp/previous-images.txt

              docker compose -f docker-compose.integration.yml up -d
              echo "Rollback complete ✅"
            else
              echo "No previous images found — stopping services"
              docker compose -f docker-compose.integration.yml down
            fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## CD Integration" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by CI run:** ${{ github.event.workflow_run.id }}" >> $GITHUB_STEP_SUMMARY