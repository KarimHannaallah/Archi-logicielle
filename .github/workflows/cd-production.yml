name: CD — Production

on:
  release:
    types: [published]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Extract versions from compatibility-manifest
        id: versions
        run: |
          python3 << EOF
          import yaml, os

          with open("compatibility-manifest.yml") as f:
              manifest = yaml.safe_load(f)

          # Toujours utiliser le dernier entry — indépendant du tag de release
          release = manifest["releases"][-1]

          s = release["services"]
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"auth_version={s['auth-service'].lstrip('v')}\n")
              f.write(f"task_version={s['task-service'].lstrip('v')}\n")
              f.write(f"project_version={s['project-service'].lstrip('v')}\n")
              f.write(f"notif_version={s['notification-service'].lstrip('v')}\n")
              f.write(f"frontend_version={s.get('frontend', 'latest').lstrip('v')}\n")
          EOF

      - name: Show resolved versions
        run: |
          echo "auth-service    : ${{ steps.versions.outputs.auth_version }}"
          echo "task-service    : ${{ steps.versions.outputs.task_version }}"
          echo "project-service : ${{ steps.versions.outputs.project_version }}"
          echo "notification    : ${{ steps.versions.outputs.notif_version }}"
          echo "frontend        : ${{ steps.versions.outputs.frontend_version }}"

      - name: Deploy to production VM (sequential)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 10m
          envs: AUTH_VERSION,TASK_VERSION,PROJECT_VERSION,NOTIF_VERSION,FRONTEND_VERSION
          script: |
            set -e
            cd /opt/app

            curl -sf \
              "https://raw.githubusercontent.com/KarimHannaallah/Archi-logicielle/main/docker-compose.production.yml" \
              -o docker-compose.production.yml
            echo "✅ docker-compose.production.yml téléchargé"

            docker compose -f docker-compose.production.yml ps -q \
              | xargs -r docker inspect --format='{{.Image}} {{.Name}}' \
              > /tmp/previous-images.txt || true
            echo "Previous images saved:"
            cat /tmp/previous-images.txt || true

            echo "Pulling images..."
            AUTH_VERSION=$AUTH_VERSION \
            TASK_VERSION=$TASK_VERSION \
            PROJECT_VERSION=$PROJECT_VERSION \
            NOTIF_VERSION=$NOTIF_VERSION \
            FRONTEND_VERSION=$FRONTEND_VERSION \
            docker compose -f docker-compose.production.yml pull

            SERVICES="auth-service task-service project-service notification-service frontend"

            for SVC in $SERVICES; do
              echo "=== Deploying $SVC ==="
              AUTH_VERSION=$AUTH_VERSION \
              TASK_VERSION=$TASK_VERSION \
              PROJECT_VERSION=$PROJECT_VERSION \
              NOTIF_VERSION=$NOTIF_VERSION \
              FRONTEND_VERSION=$FRONTEND_VERSION \
              docker compose -f docker-compose.production.yml up -d --no-deps "$SVC"

              RETRIES=20
              for i in $(seq 1 $RETRIES); do
                STATUS=$(docker compose -f docker-compose.production.yml ps "$SVC" --format json | grep -o '"healthy"\|"running"' | head -1 || echo "unknown")
                echo "  $SVC: $STATUS (attempt $i/$RETRIES)"
                [ "$STATUS" = '"healthy"' ] || [ "$STATUS" = '"running"' ] && break
                if [ "$i" -eq "$RETRIES" ]; then
                  echo "ERROR: $SVC failed to become healthy"
                  exit 1
                fi
                sleep 10
              done
              echo "$SVC deployed successfully ✅"
            done

            echo "All services deployed ✅"
            docker compose -f docker-compose.production.yml ps
        env:
          AUTH_VERSION: ${{ steps.versions.outputs.auth_version }}
          TASK_VERSION: ${{ steps.versions.outputs.task_version }}
          PROJECT_VERSION: ${{ steps.versions.outputs.project_version }}
          NOTIF_VERSION: ${{ steps.versions.outputs.notif_version }}
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}

      - name: Post-deploy healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            set -e
            echo "Waiting for all services to be ready..."

            check_service() {
              local url=$1
              local name=$2
              for i in $(seq 1 12); do
                if curl -sf "$url" > /dev/null 2>&1; then
                  echo "  $name ready after ${i}x5s ✅"
                  return 0
                fi
                echo "  $name not ready yet (attempt $i/12)..."
                sleep 5
              done
              echo "$name FAIL — timeout"
              return 1
            }

            check_service http://localhost:3001/health "auth-service"
            check_service http://localhost:3000/health "task-service"
            check_service http://localhost:3002/health "project-service"
            check_service http://localhost:3003/health "notification-service"

            for i in $(seq 1 12); do
              CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "000")
              if echo "$CODE" | grep -q "200\|301\|302"; then
                echo "  frontend ready ✅"
                break
              fi
              echo "  frontend not ready yet ($CODE) (attempt $i/12)..."
              sleep 5
              if [ "$i" -eq "12" ]; then
                echo "frontend FAIL" && exit 1
              fi
            done

            echo "All production healthchecks passed ✅"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 10m
          script: |
            cd /opt/app
            echo "Rolling back to previous images..."

            if [ -f /tmp/previous-images.txt ] && [ -s /tmp/previous-images.txt ]; then
              docker compose -f docker-compose.production.yml down
              AUTH_VERSION=latest TASK_VERSION=latest PROJECT_VERSION=latest \
              NOTIF_VERSION=latest FRONTEND_VERSION=latest \
              docker compose -f docker-compose.production.yml up -d
              echo "Rollback to latest complete ✅"
            else
              echo "No previous images found — stopping services"
              docker compose -f docker-compose.production.yml down
            fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## CD Production" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| auth-service | ${{ steps.versions.outputs.auth_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| task-service | ${{ steps.versions.outputs.task_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| project-service | ${{ steps.versions.outputs.project_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| notification-service | ${{ steps.versions.outputs.notif_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | ${{ steps.versions.outputs.frontend_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY