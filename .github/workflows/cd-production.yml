name: CD — Production

on:
  release:
    types: [published]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Extract version from release tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $VERSION"

      - name: Deploy to production VM (sequential)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 10m
          envs: VERSION
          script: |
            set -e
            cd /opt/app

            # Télécharger le fichier compose depuis GitHub
            curl -sf \
              "https://raw.githubusercontent.com/KarimHannaallah/Archi-logicielle/main/docker-compose.production.yml" \
              -o docker-compose.production.yml

            echo "✅ docker-compose.production.yml téléchargé"

            # Sauvegarder les images actuelles pour rollback
            docker compose -f docker-compose.production.yml ps -q \
              | xargs -r docker inspect --format='{{.Image}} {{.Name}}' \
              > /tmp/previous-images.txt || true
            echo "Previous images saved:"
            cat /tmp/previous-images.txt || true

            # Pull versioned images from GHCR
            echo "Pulling images with tag: $VERSION"
            VERSION=$VERSION docker compose -f docker-compose.production.yml pull

            # Sequential service restart
            SERVICES="auth-service task-service project-service notification-service frontend"

            for SVC in $SERVICES; do
              echo "=== Deploying $SVC ==="
              VERSION=$VERSION docker compose -f docker-compose.production.yml up -d --no-deps "$SVC"

              RETRIES=20
              for i in $(seq 1 $RETRIES); do
                STATUS=$(docker compose -f docker-compose.production.yml ps "$SVC" --format json | grep -o '"healthy"\|"running"' | head -1 || echo "unknown")
                echo "  $SVC: $STATUS (attempt $i/$RETRIES)"
                [ "$STATUS" = '"healthy"' ] || [ "$STATUS" = '"running"' ] && break
                if [ "$i" -eq "$RETRIES" ]; then
                  echo "ERROR: $SVC failed to become healthy"
                  exit 1
                fi
                sleep 10
              done
              echo "$SVC deployed successfully ✅"
            done

            echo "All services deployed ✅"
            docker compose -f docker-compose.production.yml ps
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Post-deploy healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            set -e
            echo "Waiting 15s for services to stabilize..."
            sleep 15
            echo "Running production healthchecks..."
            curl -sf http://localhost:3001/health || (echo "auth-service FAIL" && exit 1)
            curl -sf http://localhost:3000/health || (echo "task-service FAIL" && exit 1)
            curl -sf http://localhost:3002/health || (echo "project-service FAIL" && exit 1)
            curl -sf http://localhost:3003/health || (echo "notification-service FAIL" && exit 1)
            curl -sf -o /dev/null -w "%{http_code}" http://localhost/ | grep -q "200\|301\|302" || (echo "frontend FAIL" && exit 1)
            echo "All production healthchecks passed ✅"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 10m
          script: |
            cd /opt/app
            echo "Rolling back to previous images..."

            if [ -f /tmp/previous-images.txt ] && [ -s /tmp/previous-images.txt ]; then
              docker compose -f docker-compose.production.yml down

              while IFS=' ' read -r image name; do
                SERVICE=$(echo "$name" | sed 's|.*-\([^-]*\)-1$|\1|' | tr -d '/')
                if docker image inspect "$image" > /dev/null 2>&1; then
                  echo "Retagging $image for $SERVICE"
                  VERSION_OLD=$(echo "$image" | grep -o '[^:]*$')
                  docker tag "$image" "ghcr.io/karimhannaallah/archi-logicielle/$SERVICE:$VERSION_OLD" || true
                fi
              done < /tmp/previous-images.txt

              PREV_VERSION=$(cat /tmp/previous-images.txt | grep 'archi-logicielle' | head -1 | grep -o '[^:]*$' || echo "latest")
              echo "Rolling back to version: $PREV_VERSION"
              VERSION=$PREV_VERSION docker compose -f docker-compose.production.yml up -d
              echo "Rollback complete ✅"
            else
              echo "No previous images found — stopping services"
              docker compose -f docker-compose.production.yml down
            fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## CD Production" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY