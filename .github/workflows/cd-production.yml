name: CD — Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. sha-abc1234 or 1.0.0)"
        required: false
        default: "latest"
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Deploy to production VM (sequential)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/app

            # Save current state for rollback
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "$PREVIOUS_COMMIT" > /tmp/rollback-commit.txt
            docker compose --profile mysql ps -q | xargs -r docker inspect --format='{{index .Config.Image}}' > /tmp/previous-images.txt 2>/dev/null || true

            # Pull latest code
            git pull origin main

            # Sequential service restart (one at a time to minimize downtime)
            SERVICES="auth-service task-service project-service notification-service frontend"

            for SVC in $SERVICES; do
              echo "=== Deploying $SVC ==="
              docker compose --profile mysql up --build -d --no-deps "$SVC"

              # Wait for this service to be healthy
              RETRIES=20
              for i in $(seq 1 $RETRIES); do
                STATUS=$(docker compose --profile mysql ps "$SVC" --format json | grep -o '"healthy"\|"running"' | head -1 || echo "unknown")
                echo "  $SVC: $STATUS (attempt $i/$RETRIES)"
                [ "$STATUS" = '"healthy"' ] || [ "$STATUS" = '"running"' ] && break
                if [ "$i" -eq "$RETRIES" ]; then
                  echo "ERROR: $SVC failed to become healthy"
                  exit 1
                fi
                sleep 10
              done
              echo "$SVC deployed successfully"
            done

            echo "All services deployed"
            docker compose --profile mysql ps

      - name: Post-deploy healthcheck
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            set -e
            echo "Running production healthchecks..."
            curl -sf http://localhost:3001/health || (echo "auth-service FAIL" && exit 1)
            curl -sf http://localhost:3000/health || (echo "task-service FAIL" && exit 1)
            curl -sf http://localhost:3002/health || (echo "project-service FAIL" && exit 1)
            curl -sf http://localhost:3003/health || (echo "notification-service FAIL" && exit 1)
            curl -sf http://localhost/              || (echo "frontend FAIL" && exit 1)
            echo "All production healthchecks passed"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST_PROD }}
          username: ${{ secrets.VM_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          command_timeout: 10m
          script: |
            cd /opt/app
            echo "Rolling back to previous commit..."
            PREVIOUS_COMMIT=$(cat /tmp/rollback-commit.txt 2>/dev/null || echo "HEAD~1")
            git checkout "$PREVIOUS_COMMIT"
            docker compose --profile mysql up --build -d
            echo "Rollback complete — reverted to $PREVIOUS_COMMIT"

      - name: Deployment summary
        if: always()
        run: |
          echo "## CD Production" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY