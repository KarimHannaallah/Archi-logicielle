name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**', 'perf/**']
  pull_request:
    branches: [main, dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      task-service: ${{ steps.changes.outputs.task-service }}
      project-service: ${{ steps.changes.outputs.project-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      auth-service: ${{ steps.changes.outputs.auth-service }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: changes
        run: bash .github/scripts/detect-changes.sh

  # ── Étape 1 — Checks statiques (parallèle) ──────────────────────────────────

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Lint auth-service Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: services/auth-service/Dockerfile
        continue-on-error: true
      - name: Lint task-service Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: services/task-service/Dockerfile
        continue-on-error: true
      - name: Lint project-service Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: services/project-service/Dockerfile
        continue-on-error: true
      - name: Lint notification-service Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: services/notification-service/Dockerfile
        continue-on-error: true
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: frontend/Dockerfile
        continue-on-error: true

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate docker-compose
        run: docker compose config -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check licenses auth-service
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start services/auth-service
        continue-on-error: true
      - name: Check licenses task-service
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start services/task-service
        continue-on-error: true
      - name: Check licenses project-service
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start services/project-service
        continue-on-error: true
      - name: Check licenses notification-service
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start services/notification-service
        continue-on-error: true
      - name: Check licenses frontend
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start frontend
        continue-on-error: true

  # ── Étape 2 — Build et tests ─────────────────────────────────────────────────

  build-services:
    needs: [detect-changes, gitleaks, validate-compose, hadolint]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        needs.detect-changes.outputs.auth-service == 'true' ||
        needs.detect-changes.outputs.task-service == 'true' ||
        needs.detect-changes.outputs.project-service == 'true' ||
        needs.detect-changes.outputs.notification-service == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service }}
          - service: task-service
            changed: ${{ needs.detect-changes.outputs.task-service }}
          - service: project-service
            changed: ${{ needs.detect-changes.outputs.project-service }}
          - service: notification-service
            changed: ${{ needs.detect-changes.outputs.notification-service }}
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "⏭️ ${{ matrix.service }} non modifié — skippé"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.changed == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.changed == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include-workspace-root -w services/${{ matrix.service }}
        if: matrix.changed == 'true'
      - name: npm audit
        if: matrix.changed == 'true'
        run: npm audit --audit-level=moderate -w services/${{ matrix.service }} --omit=dev
        continue-on-error: true
      - name: Lint
        if: matrix.changed == 'true'
        run: npm run lint --if-present -w services/${{ matrix.service }}
        continue-on-error: true
      - name: Architecture lint
        if: matrix.changed == 'true'
        run: npm run lint:arch --if-present -w services/${{ matrix.service }}
        continue-on-error: true
      - name: Run tests
        if: matrix.changed == 'true'
        run: npm test -w services/${{ matrix.service }} -- --coverage --coverageReporters=lcov --coverageReporters=json-summary
        env:
          USE_INMEMORY: "true"
          JWT_SECRET: "change-me-in-production"
      - name: Upload coverage
        if: matrix.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage/
      - name: Upload test results
        if: always() && matrix.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/test-results/

  build-frontend:
    needs: [detect-changes, gitleaks, validate-compose, hadolint]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci -w frontend
      - name: Lint
        run: npm run lint --if-present -w frontend
        continue-on-error: true
      - run: npm run build -w frontend
      
  # ── Étape 2b — Tests d'intégration (docker compose) ───────────────────────

  integration-tests:
    needs: [build-services, build-frontend]
    if: |
      always() &&
      needs.build-services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and start all services
        run: |
          cp .env.example .env
          docker compose --profile mysql up --build -d
        timeout-minutes: 5
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 30); do
            HEALTHY=$(docker compose --profile mysql ps --format json | grep -c '"healthy"' || true)
            echo "  healthy: $HEALTHY/4 (attempt $i)"
            [ "$HEALTHY" -ge 4 ] && break
            sleep 5
          done
          docker compose --profile mysql ps
      - name: Run integration healthchecks
        run: |
          set -e
          echo "Testing auth-service..."
          docker compose exec -T auth-service wget -qO- http://localhost:3001/health
          echo ""
          echo "Testing task-service..."
          docker compose exec -T task-service wget -qO- http://localhost:3000/health
          echo ""
          echo "Testing project-service..."
          docker compose exec -T project-service wget -qO- http://localhost:3002/health
          echo ""
          echo "Testing notification-service..."
          docker compose exec -T notification-service wget -qO- http://localhost:3003/health
          echo ""
          echo "All integration healthchecks passed"
      - name: Check compatibility labels
        run: bash .github/scripts/check-compatibility.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile mysql logs --tail=50
      - name: Cleanup
        if: always()
        run: docker compose --profile mysql down -v

  # ── Étape 2c — Contract tests Pact ──────────────────────────────────────────

  pact:
    needs: [build-services]
    if: always() && needs.build-services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install pact dependencies
        run: npm ci
        working-directory: pacts
      - name: Run consumer tests (generate pact)
        run: npm run test:consumer
        working-directory: pacts
        env:
          JWT_SECRET: test-secret
      - name: Run provider verification
        run: npm run test:provider
        working-directory: pacts
        env:
          JWT_SECRET: test-secret
      - name: Upload pact files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pacts
          path: pacts/frontend-auth-service.json

  # ── Étape 3 — Qualité du code ────────────────────────────────────────────────

  sonarqube:
    needs: [build-services, build-frontend, integration-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: false
        continue-on-error: true

      - name: Move coverage to correct paths
        run: |
          mkdir -p services/task-service/coverage
          mkdir -p services/project-service/coverage
          mkdir -p services/auth-service/coverage
          mkdir -p services/notification-service/coverage
          cp coverage-task-service/lcov.info services/task-service/coverage/ 2>/dev/null || true
          cp coverage-project-service/lcov.info services/project-service/coverage/ 2>/dev/null || true
          cp coverage-auth-service/lcov.info services/auth-service/coverage/ 2>/dev/null || true
          cp coverage-notification-service/lcov.info services/notification-service/coverage/ 2>/dev/null || true
        continue-on-error: true

      - name: Run tests if no coverage artifacts
        run: |
          npm ci
          MISSING=false
          [ ! -f services/task-service/coverage/lcov.info ] && MISSING=true
          [ ! -f services/project-service/coverage/lcov.info ] && MISSING=true
          [ ! -f services/auth-service/coverage/lcov.info ] && MISSING=true
          [ ! -f services/notification-service/coverage/lcov.info ] && MISSING=true

          if [ "$MISSING" = "true" ]; then
            echo "Some coverage files missing — running tests..."
            npm test -w services/task-service -- --coverage --coverageReporters=lcov || true
            npm test -w services/project-service -- --coverage --coverageReporters=lcov || true
            npm test -w services/auth-service -- --coverage --coverageReporters=lcov || true
            npm test -w services/notification-service -- --coverage --coverageReporters=lcov || true
          else
            echo "All coverage artifacts found — skipping test run ✅"
          fi
        env:
          USE_INMEMORY: "true"
          JWT_SECRET: "change-me-in-production"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@aa494459d7c39c106cc77b166de8b4250a32bb97
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Étape 4 — Build Docker (matrix + metadata-action + skip si unchanged) ────

  docker-build:
    needs: [detect-changes, build-services, build-frontend, sonarqube]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        needs.detect-changes.outputs.auth-service == 'true' ||
        needs.detect-changes.outputs.task-service == 'true' ||
        needs.detect-changes.outputs.project-service == 'true' ||
        needs.detect-changes.outputs.notification-service == 'true' ||
        needs.detect-changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service }}
            file: services/auth-service/Dockerfile
            pkg: services/auth-service/package.json
          - service: task-service
            changed: ${{ needs.detect-changes.outputs.task-service }}
            file: services/task-service/Dockerfile
            pkg: services/task-service/package.json
          - service: project-service
            changed: ${{ needs.detect-changes.outputs.project-service }}
            file: services/project-service/Dockerfile
            pkg: services/project-service/package.json
          - service: notification-service
            changed: ${{ needs.detect-changes.outputs.notification-service }}
            file: services/notification-service/Dockerfile
            pkg: services/notification-service/package.json
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
            file: frontend/Dockerfile
            pkg: frontend/package.json
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "⏭️ ${{ matrix.service }} image non modifiée — skippée"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.changed == 'true'
        with:
          fetch-depth: 2

      - name: Set lowercase repo
        if: matrix.changed == 'true'
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Read version from package.json
        if: matrix.changed == 'true'
        id: pkg
        run: |
          VERSION=$(node -p "require('./${{ matrix.pkg }}').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Detect version change
        if: matrix.changed == 'true'
        id: version-changed
        run: |
          OLD_VERSION=$(git show HEAD~1:${{ matrix.pkg }} 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          if [ "$OLD_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Login to GHCR
        if: matrix.changed == 'true' && github.ref == 'refs/heads/main'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: matrix.changed == 'true'
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/${{ env.REPO }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true
            type=raw,value=${{ steps.pkg.outputs.major }},enable=${{ github.ref == 'refs/heads/main' && steps.version-changed.outputs.changed == 'true' }}
            type=raw,value=${{ steps.pkg.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.version-changed.outputs.changed == 'true' }}

      - name: Build and push ${{ matrix.service }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image summary
        if: matrix.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "### ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Étape 5 — Scan de sécurité ───────────────────────────────────────────────

  trivy:
    needs: docker-build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ── Étape 6 — Mise à jour du manifeste de compatibilité ────────────────────

  update-compatibility-manifest:
    needs: [docker-build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update compatibility manifest
        run: |
          AUTH_V=$(node -p "require('./services/auth-service/package.json').version")
          TASK_V=$(node -p "require('./services/task-service/package.json').version")
          PROJ_V=$(node -p "require('./services/project-service/package.json').version")
          NOTIF_V=$(node -p "require('./services/notification-service/package.json').version")
          FRONTEND_V=$(node -p "require('./frontend/package.json').version")

          python3 -c "
          import yaml
          data = {'releases': [{'services': {
              'auth-service': 'v$AUTH_V',
              'task-service': 'v$TASK_V',
              'project-service': 'v$PROJ_V',
              'notification-service': 'v$NOTIF_V',
              'frontend': 'v$FRONTEND_V',
          }}]}
          with open('compatibility-manifest.yml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compatibility-manifest.yml
          git diff --cached --quiet || git commit -m "ci: update compatibility manifest [skip ci]"
          git push || true

  # ── Résumé ───────────────────────────────────────────────────────────────────

  pipeline-summary:
    needs: [build-services, build-frontend, sonarqube, docker-build, hadolint, trivy, validate-compose, gitleaks, license-check, update-compatibility-manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🚀 Pipeline CI — Résumé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| gitleaks | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| validate-compose | ${{ needs.validate-compose.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| hadolint | ${{ needs.hadolint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| license-check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-services | ${{ needs.build-services.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build-frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| sonarqube | ${{ needs.sonarqube.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| docker-build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| trivy | ${{ needs.trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY