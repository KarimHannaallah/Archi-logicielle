name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      task-service: ${{ steps.changes.outputs.task-service }}
      project-service: ${{ steps.changes.outputs.project-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed services
        id: changes
        run: bash .github/scripts/detect-changes.sh

  build-services:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: task-service
          - service: project-service
          - service: notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci -w services/${{ matrix.service }}
      - name: npm audit
        run: npm audit --audit-level=moderate -w services/${{ matrix.service }} --omit=dev
        continue-on-error: true
      - name: Lint
        run: npm run lint --if-present -w services/${{ matrix.service }}
      - name: Architecture lint
        run: npm run lint:arch --if-present -w services/${{ matrix.service }}
        continue-on-error: true
      - run: npm test -w services/${{ matrix.service }} -- --coverage --coverageReporters=lcov --coverageReporters=json-summary
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage/

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci -w frontend
      - name: Lint
        run: npm run lint --if-present -w frontend
        continue-on-error: true
      - run: npm run build -w frontend

  docker-build:
    needs: [build-services, build-frontend]
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build task-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/task-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: task-service:${{ github.sha }}

      - name: Build project-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/project-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: project-service:${{ github.sha }}

      - name: Build notification-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/notification-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: notification-service:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: frontend:${{ github.sha }}

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint task-service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/task-service/Dockerfile
      - name: Lint project-service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/project-service/Dockerfile
      - name: Lint notification-service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/notification-service/Dockerfile
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  trivy:
    needs: docker-build
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check licenses task-service
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start services/task-service
        continue-on-error: true
      - name: Check licenses project-service
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start services/project-service
        continue-on-error: true
      - name: Check licenses notification-service
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start services/notification-service
        continue-on-error: true
      - name: Check licenses frontend
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --start frontend
        continue-on-error: true