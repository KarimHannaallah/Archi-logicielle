services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_DB_LOCATION=/data/auth.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=http://localhost
      - PORT=3001
    volumes:
      - auth-data:/data

  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_DB_LOCATION=/data/task.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=http://localhost
      - PORT=3000
      - REDIS_HOST=redis
      - AUTH_SERVICE_URL=http://auth-service:3001
    volumes:
      - task-data:/data
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - path: .env
        required: false
    environment:
      - SQLITE_DB_LOCATION=/data/project.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PORT=3002
      - REDIS_HOST=redis
      - AUTH_SERVICE_URL=http://auth-service:3001
    volumes:
      - project-data:/data
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_HOST=redis
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - task-service
      - project-service
      - notification-service

  mysql:
    image: mysql:8
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${MYSQL_DB:-todos}
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todopass}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-utodo", "-ptodopass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth-data:
  task-data:
  project-data:
  mysql-data: